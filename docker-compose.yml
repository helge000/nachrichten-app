services:
  app:
    build: .
    image: nachrichten-app
    restart: unless-stopped
    environment:
      PORT: "5174"
      HOST: "0.0.0.0"
      SYNC_DIR: "/app/data/sync"
    # Kein Port nach aussen - nur Caddy spricht mit der App.
    expose:
      - "5174"
    volumes:
      # Synchronisierte Einstellungen - muss einen Neustart ueberleben.
      - sync_data:/app/data

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data      # Zertifikate - unbedingt persistent halten
      - caddy_config:/config
    depends_on:
      - app

volumes:
  sync_data:
  caddy_data:
  caddy_config:
